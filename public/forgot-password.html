<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | IntelliQuiz</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div id="toast-region"></div><main class="auth-wrap"><section class="glass-card auth-main" style="width:min(440px,100%)">
<h2>Forgot password?</h2><p class="text-muted">Enter your student account email. If it exists, we will send a reset link.</p>
<form id="forgot-form"><div class="field"><label>Email address</label><input class="input" id="email" type="email" required autocomplete="email"></div><button class="btn btn-primary btn-block" type="submit">Send reset link</button></form>
<p id="message" class="text-muted"></p><p class="form-toggle-link"><a href="/">Back to login</a></p></section></main>
<script src="/js/api.js"></script><script>
document.getElementById('forgot-form').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await IQ.api('/student/forgot-password',{method:'POST',body:{email:document.getElementById('email').value.trim()},auth:false});document.getElementById('message').textContent=r.message;}catch(x){document.getElementById('message').textContent=x.message;}finally{b.disabled=false;}});
</script></body></html>
