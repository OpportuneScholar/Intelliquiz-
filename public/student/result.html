<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Result — IntelliQuiz</title>
<link rel="icon" href="/assets/logo.png" type="image/png">
<link rel="stylesheet" href="/css/style.css">
<style>
  .score-hero { text-align:center; padding:40px; }
  .score-ring {
    width:160px; height:160px; border-radius:50%; margin:0 auto 20px;
    display:flex; align-items:center; justify-content:center; position:relative;
    background: conic-gradient(var(--violet-500) calc(var(--pct,0) * 1%), rgba(255,255,255,0.08) 0);
  }
  .score-ring::before { content:''; position:absolute; inset:10px; border-radius:50%; background: var(--navy-900); }
  [data-theme="light"] .score-ring::before { background: var(--navy-800); }
  .score-ring span { position:relative; z-index:1; font-family:var(--font-display); font-size:30px; font-weight:800; }
  .result-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:14px; margin-top:24px; }
  .rstat { padding:16px; text-align:center; }
  .rstat .v { font-family:var(--font-display); font-size:22px; font-weight:800; }
  .rstat .l { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-top:4px; }
  .breakdown-item { padding:18px; margin-bottom:12px; }
  .b-correct { border-left: 3px solid var(--green-500); }
  .b-wrong { border-left: 3px solid var(--red-500); }
  .b-skipped { border-left: 3px solid var(--text-muted); }
  @media print {
    .topbar, .no-print { display:none !important; }
    body { background: #fff; color: #000; }
  }
</style>
</head>
<body>
<div class="splash" id="splash"><img src="/assets/logo.png"><div class="ring"></div></div>
<div id="toast-region"></div>

<div class="topbar no-print">
  <div class="topbar-inner">
    <div class="brand"><img src="/assets/logo.png" alt=""><div><div class="brand-name">Intelli<span class="accent">Quiz</span></div></div></div>
    <div class="flex items-center gap-12">
      <button class="btn btn-ghost btn-sm" onclick="window.print()">🖨 Download PDF</button>
      <button class="theme-toggle" id="theme-toggle">🌙</button>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Log Out</button>
    </div>
  </div>
</div>

<div class="page-shell" style="max-width:760px;">
  <div class="glass-card score-hero" id="score-hero"></div>
  <div class="section-title mt-24">Question-by-Question Review</div>
  <div id="breakdown-list"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/result.js"></script>
</body>
</html>
