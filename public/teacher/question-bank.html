<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Bank — IntelliQuiz</title><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="/css/style.css"><style>.teacher-nav{display:flex;gap:10px;flex-wrap:wrap;padding:12px 24px;max-width:1300px;margin:auto;border-bottom:1px solid var(--glass-border)}.teacher-nav a{padding:10px 15px;border:1px solid var(--glass-border);border-radius:12px;background:var(--glass-bg);font-size:13px;font-weight:600}.qrow{padding:16px;margin:10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.hint{font-size:12px;color:var(--text-muted)}</style></head><body><div class="topbar"><div class="topbar-inner"><div class="brand"><img src="/assets/logo.png"><div class="brand-name">Intelli<span class="accent">Quiz</span></div></div><div class="flex items-center gap-12"><button class="theme-toggle" id="theme-toggle">🌙</button><button class="btn btn-ghost btn-sm" id="logout-btn">Log Out</button></div></div></div><nav class="teacher-nav"><a href="/teacher/dashboard.html">▦ Dashboard</a><a href="/teacher/dashboard.html#exam-grid">▤ Examinations</a><a href="/teacher/results.html">▣ All Results</a><a href="/teacher/question-bank.html">☷ Question Bank</a></nav><main class="page-shell"><div class="flex justify-between items-center mb-16" style="flex-wrap:wrap;gap:12px"><h2>Unit-wise Question Bank</h2><button class="btn btn-ghost" id="template-btn">⬇ Download CSV Template</button></div><div class="glass-card card-pad"><h3>Import questions in bulk</h3><p class="text-muted">CSV columns: questionText, optionA, optionB, optionC, optionD, correctOption, explanation, difficulty, marks. correctOption must be A, B, C or D.</p><div class="row-2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="field"><label>Subject</label><input class="input" id="subject" placeholder="Data Structures" required></div><div class="field"><label>Unit</label><input class="input" id="unit" placeholder="Unit 1" required></div></div><div class="field"><label>CSV file</label><input class="input" id="csv-file" type="file" accept=".csv,text/csv"></div><div class="actions"><button class="btn btn-primary" id="import-btn">Import and Save</button><button class="btn btn-ghost" id="refresh-btn">Refresh bank</button></div><p id="message" class="hint"></p></div><div class="flex justify-between items-center mt-24 mb-16"><h3>Saved questions</h3><select class="input" id="unit-filter" style="max-width:240px"><option value="">All units</option></select></div><div id="questions"></div></main><div id="toast-region"></div><script src="/js/api.js"></script><script src="/js/question-bank.js"></script></body></html>
