<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | IntelliQuiz</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div id="toast-region"></div><main class="auth-wrap"><section class="glass-card auth-main" style="width:min(440px,100%)">
<h2>Choose a new password</h2><p class="text-muted">Reset links expire after 30 minutes.</p>
<form id="reset-form"><div class="field"><label>New password</label><input class="input" id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input class="input" id="confirm" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn btn-primary btn-block" type="submit">Update password</button></form>
<p id="message" class="text-muted" role="status"></p><p class="form-toggle-link"><a href="/">Back to login</a></p></section></main>
<script src="/js/api.js"></script><script>
document.getElementById('reset-form').addEventListener('submit', async e => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  if (password !== document.getElementById('confirm').value) {
    document.getElementById('message').textContent = 'Passwords do not match.';
    return;
  }
  const role = new URLSearchParams(location.search).get('role') === 'teacher' ? 'teacher' : 'student';
  const button = e.target.querySelector('button');
  button.disabled = true;
  try {
    const result = await IQ.api('/' + role + '/reset-password', {
      method:'POST',
      body:{ token:new URLSearchParams(location.search).get('token'), password },
      auth:false
    });
    document.getElementById('message').textContent = result.message;
  } catch (error) {
    document.getElementById('message').textContent = error.message;
  } finally {
    button.disabled = false;
  }
});
</script></body></html>
